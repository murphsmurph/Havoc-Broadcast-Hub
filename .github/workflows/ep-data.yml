name: Update Elite Prospects data

# Opens a PR with the diff — NEVER pushes to main (standing law #7 in
# HAVOC_HUB_MASTER_DOCUMENT.md: automations open PRs; a human merges).
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      max_calls:
        description: 'EP API call budget for this run (blank = default 220)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  build-ep-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build EP data
        env:
          EP_API_KEY: ${{ secrets.EP_API_KEY }}
          HT_KEY: ${{ vars.HT_KEY }}
          MAX_EP_CALLS: ${{ inputs.max_calls }}
        run: node scripts/build-ep-data.mjs

      - name: Open a PR with the diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only the two files this script writes — never the broadcast spine
          git add data/ep-players.json data/ep-teams.json
          if git diff --staged --quiet; then
            echo "No data changes — no PR."
            exit 0
          fi
          BRANCH="ep-data-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "Update Elite Prospects data (scheduled)"
          git push -u origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" \
            --title "EP data refresh $(date -u +%Y-%m-%d)" \
            --body "$(printf 'Automated weekly EP data build — ep-players.json / ep-teams.json only. Review before merging.\n\n```\n%s\n```' "$(git show --stat --format= HEAD)")" \
            || echo "PR already open for $BRANCH"

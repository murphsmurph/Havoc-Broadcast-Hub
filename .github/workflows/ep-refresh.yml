name: Refresh stats from EliteProspects

# Opens a PR with the diff — NEVER pushes to main, so bad API data can't
# silently reach the broadcast. Runs the morning after game nights
# (Fri/Sat/Sun 11:00 UTC ≈ 5-6am Central) during the season, or on demand.
# Default mode syncs current_season ONLY — the frozen history, baselines and
# bio prose are guarded. Counters never go down: a game-night manual bump
# stays ahead of a lagging API.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * 10-12,1-4 5,6,0'   # Fri, Sat, Sun 11:00 UTC, Oct–Apr

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync current_season from the EP API
        env:
          EP_API_KEY: ${{ secrets.EP_API_KEY }}
        run: node scripts/update_stats.mjs | tee /tmp/ep-diff.txt
      - name: Open a PR with the diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet data/havoc_players.json; then
            echo "No changes — no PR."
            exit 0
          fi
          BRANCH="ep-refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/havoc_players.json
          git commit -m "Sync current_season counters from the EliteProspects API"
          git push -u origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" \
            --title "EP current-season sync $(date -u +%Y-%m-%d)" \
            --body "$(printf 'Automated post-game-night sync — current_season counters only. Review before merging — the site and the bio pages read this file on the air.\n\n```\n%s\n```' "$(cat /tmp/ep-diff.txt)")" \
            || echo "PR already open for $BRANCH"

name: Fetch SPHL daily report

on:
  schedule:
    - cron: '0 11 * * *'   # ~6am Central, after overnight games post
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch + parse daily report
        run: node scripts/fetch-daily-report.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sphl-daily.json data/sphl-daily.html
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "Update SPHL daily report data (scheduled)"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push
          fi

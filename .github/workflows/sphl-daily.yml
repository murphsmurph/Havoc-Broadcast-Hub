name: Fetch SPHL daily report

on:
  schedule:
    - cron: '0 11 * * *'   # ~6am Central, after overnight games post
  workflow_dispatch:
  push:
    paths:                  # self-test whenever the pipeline itself changes
      - '.github/workflows/sphl-daily.yml'
      - 'scripts/fetch-daily-report.mjs'
      - 'scripts/fetch-rosters.mjs'
      - 'js/daily-report-parser.js'

permissions:
  contents: write

# one run at a time — two runs racing to commit sphl-daily.json ends in a
# rebase conflict on the fetchedAt line (seen live: run 31765395835)
concurrency:
  group: sphl-daily
  cancel-in-progress: false

jobs:
  fetch-daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch + parse daily report
        run: node scripts/fetch-daily-report.mjs

      # cleanup Phase 2 — every team's roster from the HockeyTech feed.
      # The script fails SOFT (exit 0, last good file kept) so a feed hiccup
      # never blocks the daily report commit or replaces a good roster file.
      - name: Fetch league rosters
        env:
          HT_KEY: ${{ secrets.HT_KEY }}
        run: node scripts/fetch-rosters.mjs

      # Law §7 exception condition (master document, ruled 2026-08-19): the
      # freshly fetched data must pass the roster-precedence test BEFORE it
      # may be committed to main. A failure skips the commit with a warning —
      # the last good files stay in place.
      - name: Install Playwright Chromium (precedence gate)
        timeout-minutes: 8
        run: |
          npm install --no-audit --no-fund playwright
          npx playwright install --only-shell chromium
      - name: Precedence gate — test 5 against the fresh fetch
        id: gate
        timeout-minutes: 5
        run: |
          if node tests/roster_precedence.mjs; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::roster-precedence test FAILED against the freshly fetched data — commit skipped (Law §7 exception condition). Last good files remain on main."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.ok == 'true'   # self-test runs on branches fetch but never push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sphl-daily.json data/sphl-daily.html
          # the roster file may not exist until its first successful fetch
          [ -f data/sphl-rosters.json ] && git add data/sphl-rosters.json
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update SPHL daily report data (scheduled)"
          # push with retry; on a race, rebase preferring OUR fresh data
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || git rebase --abort
          done
          echo "Push failed after 3 attempts."
          exit 1
